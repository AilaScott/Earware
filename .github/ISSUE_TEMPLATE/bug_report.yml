name: Bug report
description: Report a problem with Earware — the macOS builds are new and welcome extra testing.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Earware version
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options:
        - VST3
        - AU
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: DAW and version
      placeholder: e.g. Reaper 7.42, Logic Pro 11, Ableton Live 12, Ardour 8.10
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — screenshots, audio samples, crash reports.