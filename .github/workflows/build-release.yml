name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload artifacts to (e.g. v0.1.0)"
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package VST3
        run: zip -r Earware_Linux_x64_VST3.zip build/plugins/Earware/Earware_artefacts/Release/VST3/

      - name: Package LV2
        run: zip -r Earware_Linux_x64_LV2.zip build/plugins/Earware/Earware_artefacts/Release/LV2/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" \
            Earware_Linux_x64_VST3.zip \
            Earware_Linux_x64_LV2.zip \
            --clobber

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package VST3
        run: zip -r Earware_macOS_Universal_VST3.zip build/plugins/Earware/Earware_artefacts/Release/VST3/

      - name: Package AU
        run: zip -r Earware_macOS_Universal_AU.zip build/plugins/Earware/Earware_artefacts/Release/AU/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" \
            Earware_macOS_Universal_VST3.zip \
            Earware_macOS_Universal_AU.zip \
            --clobber
